<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="420" fill="#ffffff"/>

  <!-- ESP32 box -->
  <rect x="40" y="60" width="180" height="300" rx="10" fill="#0f1115" stroke="#333" stroke-width="2"/>
  <text x="130" y="90" fill="#f0f2f5" font-size="18" font-weight="bold" text-anchor="middle">ESP32</text>
  <text x="130" y="108" fill="#8a90a0" font-size="11" text-anchor="middle">Dev Board</text>

  <!-- ESP32 pin labels + dots -->
  <circle cx="210" cy="160" r="4" fill="#4f8ff7"/>
  <text x="200" y="164" fill="#f0f2f5" font-size="13" text-anchor="end">GPIO 19</text>

  <circle cx="210" cy="200" r="4" fill="#4f8ff7"/>
  <text x="200" y="204" fill="#f0f2f5" font-size="13" text-anchor="end">GPIO 18</text>

  <circle cx="210" cy="240" r="4" fill="#4f8ff7"/>
  <text x="200" y="244" fill="#f0f2f5" font-size="13" text-anchor="end">GPIO 5</text>

  <circle cx="210" cy="280" r="4" fill="#4f8ff7"/>
  <text x="200" y="284" fill="#f0f2f5" font-size="13" text-anchor="end">GPIO 17</text>

  <circle cx="210" cy="320" r="4" fill="#3ecf8e"/>
  <text x="200" y="324" fill="#f0f2f5" font-size="13" text-anchor="end">5V</text>

  <circle cx="210" cy="340" r="4" fill="#e0e0e0"/>
  <text x="200" y="344" fill="#f0f2f5" font-size="13" text-anchor="end">GND</text>

  <!-- ULN2003 box -->
  <rect x="500" y="60" width="180" height="300" rx="10" fill="#1a1d24" stroke="#333" stroke-width="2"/>
  <text x="590" y="90" fill="#f0f2f5" font-size="18" font-weight="bold" text-anchor="middle">ULN2003</text>
  <text x="590" y="108" fill="#8a90a0" font-size="11" text-anchor="middle">Stepper Driver Board</text>

  <circle cx="510" cy="160" r="4" fill="#4f8ff7"/>
  <text x="520" y="164" fill="#f0f2f5" font-size="13" text-anchor="start">IN1</text>

  <circle cx="510" cy="200" r="4" fill="#4f8ff7"/>
  <text x="520" y="204" fill="#f0f2f5" font-size="13" text-anchor="start">IN2</text>

  <circle cx="510" cy="240" r="4" fill="#4f8ff7"/>
  <text x="520" y="244" fill="#f0f2f5" font-size="13" text-anchor="start">IN3</text>

  <circle cx="510" cy="280" r="4" fill="#4f8ff7"/>
  <text x="520" y="284" fill="#f0f2f5" font-size="13" text-anchor="start">IN4</text>

  <circle cx="510" cy="320" r="4" fill="#3ecf8e"/>
  <text x="520" y="324" fill="#f0f2f5" font-size="13" text-anchor="start">+ (5V)</text>

  <circle cx="510" cy="340" r="4" fill="#e0e0e0"/>
  <text x="520" y="344" fill="#f0f2f5" font-size="13" text-anchor="start">- (GND)</text>

  <text x="590" y="380" fill="#8a90a0" font-size="11" text-anchor="middle">Motor cable (4-pin) to 28BYJ-48</text>

  <!-- Connection lines: ESP32 IN1 -> ULN2003 IN1 -->
  <line x1="210" y1="160" x2="510" y2="160" stroke="#4f8ff7" stroke-width="2"/>
  <line x1="210" y1="200" x2="510" y2="200" stroke="#4f8ff7" stroke-width="2"/>
  <line x1="210" y1="240" x2="510" y2="240" stroke="#4f8ff7" stroke-width="2"/>
  <line x1="210" y1="280" x2="510" y2="280" stroke="#4f8ff7" stroke-width="2"/>
  <line x1="210" y1="320" x2="510" y2="320" stroke="#3ecf8e" stroke-width="2"/>
  <line x1="210" y1="340" x2="510" y2="340" stroke="#aaaaaa" stroke-width="2"/>

  <!-- Note about firmware pin mapping (IN1<->IN3 swap) -->
  <text x="360" y="30" fill="#333" font-size="13" text-anchor="middle" font-weight="bold">ESP32 &#8596; ULN2003 Wiring (28BYJ-48 stepper)</text>
  <text x="360" y="400" fill="#666" font-size="10" text-anchor="middle">Note: firmware wires the stepper as IN1, IN3, IN2, IN4 (half-step order) &#8212; not physical board order.</text>
</svg>
